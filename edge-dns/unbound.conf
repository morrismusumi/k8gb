server:
    interface: 0.0.0.0
    port: 53

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    module-config: "validator iterator"

    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    hide-identity: yes
    hide-version: yes

    # DNS query logging
    verbosity: 2
    log-queries: yes
    log-replies: yes
    log-tag-queryreply: yes

    # Log to Docker stdout/stderr
    use-syslog: no
    logfile: ""

    # Include timestamps
    log-time-ascii: yes

    private-domain: "local.example.com."

    local-zone: "local.example.com." transparent

    local-data: "local.example.com. IN NS gslb-ns-east-local.example.com."
    local-data: "local.example.com. IN NS gslb-ns-west-local.example.com."

    local-data: "gslb-ns-east-local.example.com. IN A 172.19.0.100"
    local-data: "gslb-ns-west-local.example.com. IN A 172.20.0.100"

stub-zone:
    name: "local.example.com."
    stub-addr: 172.19.0.100
    stub-addr: 172.20.0.100
