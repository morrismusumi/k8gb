---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 3m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fleet-infra/apps
  prune: true
  patches:
    - patch: |
        - op: add
          path: /spec/template/spec/containers/0/env
          value:
            - name: REGION
              value: "East"
      target:
        kind: Deployment
        name: web-app
