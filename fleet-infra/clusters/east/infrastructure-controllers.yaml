---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-core
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
  patches:
    - patch: |
        - op: add
          path: /spec/values
          value:
            k8gb:
              dnsZones:
                - loadBalancedZone: "local.example.com"
                  parentZone: "example.com"
              edgeDNSServers:
                - "172.28.0.2"
              clusterGeoTag: "east"
              extGslbClustersGeoTags: "west"
            extdns:
              enabled: false
            coredns:
              serviceType: LoadBalancer
              service:
                annotations:
                  kube-vip.io/loadbalancerIPs: 172.19.0.100
      target:
        kind: HelmRelease
        name: k8gb
