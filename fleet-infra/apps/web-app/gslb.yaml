---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app
  namespace: web-app
spec:
  rules:
  - host: web-app.local.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: web-app
  namespace: web-app
spec:
  serviceHealthPolicy: Any
  resourceRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: web-app
  strategy:
    type: roundRobin
