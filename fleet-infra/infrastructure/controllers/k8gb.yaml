---
apiVersion: v1
kind: Namespace
metadata:
  name: k8gb
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8gb
  namespace: k8gb
spec:
  interval: 24h
  url: https://www.k8gb.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8gb
  namespace: k8gb
spec:
  interval: 1m
  timeout: 10m
  chart:
    spec:
      chart: k8gb
      # version: ""
      sourceRef:
        kind: HelmRepository
        name: k8gb
        namespace: k8gb
      interval: 12h
  values: {}